<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="0.5" stop-color="#e4e9f0"/>
      <stop offset="1" stop-color="#d7dee8"/>
    </linearGradient>

    <pattern id="kareler" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#101828" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1a56db" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1a56db" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#475467" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#475467" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="isik" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#zemin)"/>
  <rect width="1600" height="1000" fill="url(#kareler)"/>

  <circle cx="1350" cy="90" r="520" fill="url(#bloom)"/>
  <circle cx="80" cy="940" r="460" fill="url(#bloom2)"/>

  <polygon points="-200,1000 500,-200 900,-200 200,1000" fill="url(#isik)" opacity="0.7"/>
  <polygon points="900,1000 1600,-200 1780,-200 1080,1000" fill="url(#isik)" opacity="0.45"/>
</svg>
