<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bağlantı yok — İyi Yatırım</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f8fa;
        color: #101828;
        font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      .kart {
        background: #fff;
        border: 1px solid #e4e7ec;
        border-radius: 14px;
        padding: 30px 26px;
        max-width: 380px;
        text-align: center;
      }
      img { width: 64px; height: 64px; margin-bottom: 16px; }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { color: #667085; margin: 0 0 20px; font-size: 14.5px; }
      button {
        padding: 11px 20px;
        border: 0;
        border-radius: 8px;
        background: #1a56db;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div class="kart">
      <img src="/ikon-192.png" alt="" />
      <h1>İnternet bağlantısı yok</h1>
      <p>
        Bakiyeniz ve talepleriniz güvenlik gereği cihazda saklanmaz; bu yüzden
        panel çevrimdışı görüntülenemiyor. Bağlantı gelince tekrar deneyin.
      </p>
      <button onclick="location.reload()">Tekrar dene</button>
    </div>
  </body>
</html>
