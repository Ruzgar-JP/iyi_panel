# İyi Yatırım Paneli — nginx yapılandırması
#
# Kurulum:
#   cp /opt/iyipanel/kurulum/nginx-ornek.conf /etc/nginx/sites-available/iyipanel
#   sed -i 's/panel.iyiyatirim.org/SIZIN_ALAN_ADINIZ/g' /etc/nginx/sites-available/iyipanel
#   ln -sf /etc/nginx/sites-available/iyipanel /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Sonra SSL:
#   certbot --nginx -d panel.iyiyatirim.org
#
# certbot bu dosyayı kendisi düzenler: 443 bloğunu ve sertifika satırlarını
# ekler, 80'i yönlendirmeye çevirir. Elle SSL satırı yazmanıza gerek yok.

# Kayıt ve giriş uçlarına saniyede istek sınırı. Uygulamanın kendi sayacı
# bellekte tutuluyor; bu, sunucuya hiç ulaşmadan kesen ikinci bir katman.
limit_req_zone $binary_remote_addr zone=iy_giris:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=iy_genel:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name panel.iyiyatirim.org;

    # Yüklenen belgeler (kimlik, dekont) için üst sınır.
    # .env.local içindeki MAX_DOSYA_MB değerinden büyük olmalı.
    client_max_body_size 12M;

    # nginx sürümünü gizle
    server_tokens off;

    # ------------------------------------------------------------ günlükler
    access_log /var/log/nginx/iyipanel-access.log;
    error_log  /var/log/nginx/iyipanel-error.log;

    # ------------------------------------------------- giriş uçları (sıkı)
    # Şifre deneme saldırılarını yavaşlatır.
    location ~ ^/api/(panel|yonetim)/(giris|sifremi-unuttum)$ {
        limit_req zone=iy_giris burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------- statik dosyalar
    # Next.js'in ürettiği dosyaların adında içerik özeti var; uzun süre
    # önbelleğe alınabilirler.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/proxy_params;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ------------------------------------------------------------ geri kalan
    location / {
        limit_req zone=iy_genel burst=40 nodelay;

        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/proxy_params;

        # Uygulamanın gerçek istemci IP'sini ve protokolü görmesi için.
        # Bunlar olmadan hız sınırları herkesi tek IP sanar ve şifre
        # sıfırlama bağlantıları http:// olarak üretilir.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # Uzun süren istekler (büyük belge yükleme) kesilmesin
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # WebSocket / SSE gerekirse hazır olsun
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
