<!--
  İyi Yatırım — "Uygulamayı Yükle" butonları
  ============================================

  Siteye yapıştırılacak hazır kod. Tek dosya, dışarıdan hiçbir şey
  yüklemiyor (font, resim, kütüphane yok) — her sitede çalışır.

  KULLANIM
  --------
  Aşağıdaki <div class="iy-uygulama"> … </div> bloğunu ve üstündeki
  <style> bloğunu, sitenizde butonların görünmesini istediğiniz yere
  olduğu gibi yapıştırın.

  ADRESİ DEĞİŞTİRMEK
  ------------------
  İki bağlantıda da alan adı geçiyor. Farklı bir adres kullanıyorsanız
  "musteripanel.iyiyatirim.org" yazan iki yeri değiştirin.

  NEDEN İKİ AYRI BUTON
  --------------------
  Kurulum adımları iki telefonda tamamen farklı: Android'de tek dokunuşla
  Chrome'un kendi penceresi açılıyor, iPhone'da kullanıcının Safari'den
  elle eklemesi gerekiyor. Bağlantıdaki ?p=android / ?p=ios parametresi
  sayfaya hangi anlatımı göstereceğini söylüyor.

  TEK BUTON İSTERSENİZ
  --------------------
  Parametresiz /uygulama adresi telefonu kendi tanır. O zaman tek buton
  yeter — en alttaki örneğe bakın.
-->

<style>
  .iy-uygulama {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
  }

  .iy-uygulama a {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 22px;
    border-radius: 11px;
    background: #1a56db;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 15.5px;
    border: 0;
    transition: background 0.15s;
    /* Dokunmatik ekranda buton en az 44px yüksek olmalı (Apple önerisi) */
    min-height: 46px;
    box-sizing: border-box;
  }

  .iy-uygulama a:hover { background: #1442ad; }

  .iy-uygulama a.ios {
    background: #111827;
  }
  .iy-uygulama a.ios:hover { background: #1f2937; }

  .iy-uygulama svg { flex: none; }

  .iy-uygulama small {
    display: block;
    font-weight: 400;
    font-size: 11.5px;
    opacity: 0.75;
    margin-top: 1px;
  }

  /* Dar ekranda alt alta ve tam genişlik */
  @media (max-width: 420px) {
    .iy-uygulama { flex-direction: column; }
    .iy-uygulama a { width: 100%; justify-content: center; }
  }
</style>

<div class="iy-uygulama">
  <!-- ANDROID -->
  <a href="https://musteripanel.iyiyatirim.org/uygulama?p=android">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M17.6 9.48l1.84-3.18a.4.4 0 00-.7-.4l-1.87 3.23A11.5 11.5 0 0012 8.2c-1.76 0-3.4.38-4.87 1.03L5.26 5.9a.4.4 0 10-.7.4L6.4 9.48A9.4 9.4 0 001.5 17h21a9.4 9.4 0 00-4.9-7.52zM7 14.2a1.1 1.1 0 110-2.2 1.1 1.1 0 010 2.2zm10 0a1.1 1.1 0 110-2.2 1.1 1.1 0 010 2.2z"/>
    </svg>
    <span>
      Android
      <small>Tek dokunuşla yükle</small>
    </span>
  </a>

  <!-- iPHONE -->
  <a class="ios" href="https://musteripanel.iyiyatirim.org/uygulama?p=ios">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M16.3 12.8c0-2.2 1.8-3.3 1.9-3.3-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.3.8-.7 0-1.7-.8-2.8-.8-1.5 0-2.8.8-3.5 2.1-1.5 2.6-.4 6.5 1.1 8.6.7 1 1.5 2.2 2.6 2.2 1.1 0 1.5-.7 2.8-.7s1.6.7 2.8.7c1.2 0 1.9-1 2.6-2.1.8-1.2 1.2-2.4 1.2-2.4s-2.2-.9-2.2-3.4zM14.1 5.9c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.6 1.3-.6.6-1.1 1.7-.9 2.6 1 .1 2-.5 2.6-1.2z"/>
    </svg>
    <span>
      iPhone
      <small>Ana ekrana ekle</small>
    </span>
  </a>
</div>
